<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>fk-gk-tb</title><link rel="stylesheet" href="style.css"></head><body><main>
<h1>fk-gk-tb</h1>
<label for="agent">User-Agent string</label><textarea id="agent" rows="3" spellcheck="false" placeholder="Mozilla/5.0 ..."></textarea>
<label class="choice"><input type="checkbox" id="mail"> Outgoing email headers</label>
<label class="choice"><input type="checkbox" id="http"> HTTP/HTTPS requests</label><hr>
<label class="choice"><input type="checkbox" id="auto"> Automatically use latest Chrome Stable User-Agent</label>
<div class="settings"><label for="platform">Platform</label><select id="platform"><option value="linux">Linux</option><option value="windows">Windows</option><option value="mac">macOS</option></select></div>
<div class="settings"><label for="interval">Check every</label><select id="interval"><option value="6">6 hours</option><option value="12">12 hours</option><option value="24">24 hours</option><option value="72">3 days</option><option value="168">7 days</option></select></div>
<div class="buttons"><button id="apply">Apply</button><button id="fetch" class="secondary">Fetch now</button><button id="restore" class="secondary">Restore defaults</button></div>
<p id="last"></p><p id="status" role="status" aria-live="polite"></p>
<p class="note">Chrome Stable updates use the Chrome for Testing feed. Restore defaults disables overrides and scheduled updates. Restore before uninstalling.</p>
</main><script src="popup.js"></script></body></html>
